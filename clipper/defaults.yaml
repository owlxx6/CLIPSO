# GTA AI Clipper - default settings.
# Do not edit this file to tune a run: put overrides in config/local.yaml (all runs),
# config/streamers/<name>.yaml (one streamer) or config/tuned/<name>.yaml (written by `clipper tune`).

data_dir: data

analysis:
  hop_s: 0.5                  # timeline resolution in seconds
  audio:
    sample_rate: 16000
    baseline_window_s: 60     # loudness is compared to the median of the surrounding minute
  transcript:
    enabled: true
    language: fr              # null lets Whisper detect the language
    model: small              # tiny | base | small | medium | large-v3 | large-v3-turbo
    device: cpu               # Intel Arc: stay on cpu
    compute_type: int8
    beam_size: 1
    vad_filter: true
  visual:
    sample_every_s: 2.0       # letterbox (cinematic) check, keyframes only
    letterbox_bar_fraction: 0.09
    letterbox_luma_max: 18

signals:
  keywords:
    window_s: 2.0
    laughter_weight: 1.5
    fr: ["oh mon dieu", "mon dieu", "c'est quoi ça", "c'est quoi ce", "mais non", "non non non", "nooon",
         "je suis mort", "jsuis mort", "j'suis mort", "incroyable", "c'est fou", "la folie", "wesh",
         "au secours", "oh non", "trop fort", "la honte", "pardon", "putain", "dingue", "j'y crois pas"]
    en: ["oh my god", "oh my gosh", "no way", "what the", "let's go", "lets go", "holy", "bro", "dude",
         "oh no", "insane", "crazy", "help me", "i'm dead", "im dead"]
    laughter: ["haha", "hahaha", "ahah", "ahahah", "mdr", "ptdr", "lol", "lmao", "rires", "laughter", "laughs", "laughing"]
  speech_rate:
    window_s: 3.0
  chat:
    window_s: 10
    baseline_window_s: 300
    delay_s: 6                # chat reacts after the moment: shift the chat curve earlier
    emote_weight: 1.5
    emotes: ["KEKW", "LUL", "LULW", "OMEGALUL", "LMAO", "Pog", "PogChamp", "POGGERS", "monkaS", "W", "WWW",
             "+1", "MDR", "PTDR", "XD", "😂", "🤣", "💀"]
  viewer_clips:
    sigma_s: 6.0
    peak_fraction: 0.75       # viewers clip after the moment: the peak sits near the end of a Twitch clip

detection:
  weights:                    # `clipper tune` searches these against your hand-marked highlights
    audio: 1.0
    speech_rate: 0.4
    keywords: 0.8
    chat: 1.5
    viewer_clips: 2.0
  smoothing_s: 2.0
  min_gap_s: 30               # two highlights must be at least this far apart
  min_score: 1.0
  top_k: 40
  pre_roll_s: 14              # context kept before the peak
  post_roll_s: 8              # reaction kept after the peak
  snap_search_s: 3.0          # move cuts to the nearest sentence start/end (or quiet point) within this range
  max_overlap: 0.5
  cinematic_flag_fraction: 0.3

targets:
  campaign: {min_s: 15, max_s: 34}
  story: {min_s: 30, max_s: 60}

layout:
  default: auto               # auto | stacked | blur_fit | center_crop
  facecam_samples: 24
  facecam_min_hit_fraction: 0.3
  facecam_expand_w: 2.8       # used when the facecam overlay has no visible border: face box x 2.8
  facecam_expand_h: 2.6
  gameplay_center_x: 0.5
  gameplay_center_y: 0.5
  avoid_facecam_shift: 0.15   # move the gameplay crop aside (up to 15% of the width) so the facecam is not shown twice

render:
  width: 1080
  height: 1920
  fps: 30
  facecam_band_h: 640         # height of the facecam band in the stacked layout
  encoder: libx264            # libx264 | h264_qsv (Intel Arc / Quick Sync) | h264_videotoolbox (macOS)
  crf: 21
  preset: veryfast
  audio_bitrate: 160k
  loudness_lufs: -14
  font_name: Anton
  uppercase: true
  subtitles:
    enabled: true
    words_per_chunk: 3
    max_chars: 18
    max_gap_s: 0.6
    font_size: 96
    outline: 7
  hook:
    enabled: true
    auto: true                # take the words spoken around the peak when no hook is given
    max_words: 7
    duration_s: 2.6
    font_size: 72
  disclosure:
    enabled: false            # turn on for paid campaign clips (loi influenceurs)
    text: "PUBLICITÉ"
    font_size: 54
    margin_top: 250           # below the TikTok / Reels / Shorts top bar, which covers roughly the top 200 px
    margin_x: 64
  proxy_height: 480

captions:
  template: "{hook} | {streamer} sur GTA VI #GTA6 #GTAVI"

platforms:
  tiktok:
    target: campaign
    trim_jitter_s: 1.2
    zoom_choices: [1.0, 1.04]
    highlight_color: "#FFE500"
  instagram:
    target: campaign
    trim_jitter_s: 1.2
    zoom_choices: [1.02, 1.06]
    highlight_color: "#00E5FF"
  youtube:
    target: campaign
    trim_jitter_s: 1.2
    zoom_choices: [1.0, 1.08]
    highlight_color: "#7CFF4F"

variants:
  min_cut_distance_s: 0.4     # cuts of two platform versions of the same clip differ by at least this much
  reuse_tolerance_s: 0.25     # never reuse an in/out point already exported on the same platform

dedup:
  min_overlap: 0.5            # same source + same platform + this much time overlap = already exported
  frame_step_s: 1.0
  hash_size: 16               # 256-bit difference hash per sampled frame
  max_shift: 3
  hamming_max_fraction: 0.16
  block_similarity: 0.8       # a new export this close to an older one on the same platform is blocked
