name: Test CLIPSO
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HF_HUB_OFFLINE: '1'
      PYTHONIOENCODING: utf-8
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Linux FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install CLIPSO and test dependencies
        run: python -m pip install -e ".[dev,review,ci]"
      - name: Check FFmpeg, codecs, subtitle filters, fonts and OpenCV
        run: python -m clipper doctor
      - name: Unit, regression, Unicode and migration tests
        run: python -m pytest -m "not slow" -ra --junitxml=unit.xml
      - name: FFmpeg rendering and face detection
        run: python -m pytest -m slow -ra --junitxml=integration.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            unit.xml
            integration.xml
